name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'gradle'

      - name: Gradle 빌드
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem

      - name: jar 파일 전송
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem \
            backend/build/libs/*-SNAPSHOT.jar \
            ec2-user@${{ secrets.EC2_HOST }}:~/app-new.jar

      - name: 서버 재시작
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            pkill -f "app.jar" || true
            sleep 3
            mv -f ~/app-new.jar ~/app.jar
            nohup java -Xmx384m -jar ~/app.jar --spring.profiles.active=local > ~/app.log 2>&1 < /dev/null &
            sleep 2
            echo "재시작 완료"
          EOF
